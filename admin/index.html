<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel | MC Hoàng Phúc</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0b0b; --fg: #f5f5f5; --gold: #D4AF37; --card: #161616; --border: rgba(212,175,55,0.2); --danger: #ff4d4d; }
    body { margin: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', sans-serif; font-size: 14px; user-select: none; overflow-x: hidden; }
    
    /* --- VIVID BLOCKED UI (FULL SCREEN) --- */
    #blocked-screen { 
      position: fixed; inset: 0; background: radial-gradient(circle at center, #1a0000 0%, #000 100%); 
      z-index: 999999; display: none; align-items: center; justify-content: center; text-align: center; 
      padding: 2rem; flex-direction: column; overflow: hidden; 
    }
    .blocked-content { max-width: 700px; position: relative; }
    
    .blocked-icon { 
      font-size: 120px; color: var(--danger); margin-bottom: 1rem; 
      animation: glitch-icon 0.4s infinite alternate, pulse-danger 2s infinite; 
      text-shadow: 0 0 20px rgba(255, 77, 77, 0.5);
    }
    
    .blocked-title { 
      font-size: clamp(28px, 6vw, 52px); font-weight: 900; color: #fff; margin-bottom: 1rem; 
      text-transform: uppercase; letter-spacing: 6px; 
      animation: text-glitch 3s infinite;
    }
    
    .blocked-desc { font-size: 18px; color: #aaa; margin-bottom: 2.5rem; line-height: 1.6; }
    
    .blocked-ip-box { 
      background: rgba(255, 77, 77, 0.05); padding: 20px 40px; border-radius: 16px; 
      border: 2px solid var(--danger); box-shadow: 0 0 40px rgba(255, 77, 77, 0.15); 
      margin-bottom: 2.5rem; display: inline-block;
    }
    .blocked-ip-label { font-size: 12px; color: var(--danger); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 8px; font-weight: 700; }
    .blocked-ip-value { font-family: 'JetBrains Mono', monospace; color: #fff; font-size: 32px; font-weight: 800; letter-spacing: 1px; }
    
    .blocked-warning { color: #ff4d4d; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; animation: blink 1s step-end infinite; }
    
    @keyframes glitch-icon {
      0% { transform: translate(0); text-shadow: 2px 2px #ff0000; }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, -2px); text-shadow: -2px -2px #00ffff; }
      75% { transform: translate(-2px, -2px); }
      100% { transform: translate(0); }
    }
    @keyframes pulse-danger { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes text-glitch {
      0%, 100% { transform: none; opacity: 1; }
      7% { transform: skew(-0.5deg, -0.9deg); opacity: 0.75; }
      10% { transform: none; opacity: 1; }
      27% { transform: none; opacity: 1; }
      30% { transform: skew(0.8deg, -0.1deg); opacity: 0.75; }
      35% { transform: none; opacity: 1; }
    }

    /* --- REGULAR ADMIN UI --- */
    .header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: rgba(11,11,11,0.8); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .tab { padding: 0.6rem 1.2rem; background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--fg); cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .tab.active { background: var(--gold); color: #000; border-color: var(--gold); }
    input, textarea, select { width: 100%; padding: 0.8rem; background: #000; border: 1px solid var(--border); border-radius: 6px; color: #fff; margin-bottom: 1rem; box-sizing: border-box; font-family: inherit; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #aaa; font-weight: 500; }
    .btn { padding: 0.7rem 1.2rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: #fff; }
    .btn-danger { background: rgba(244, 67, 54, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
    .hidden { display: none; }
    .img-preview { max-width: 200px; max-height: 150px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #333; display: block; object-fit: cover; }
    .container-group { border: 2px solid #D4AF37; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; background: rgba(212,175,55,0.05); }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #333; }
    .log-item { padding: 12px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
    .log-link { color: var(--gold); text-decoration: underline; font-size: 0.8rem; font-weight: 600; }
  </style>
  <script>
    // --- ADVANCED SECURITY: IP & GLOBAL BLOCKING ---
    (async function initSecurity() {
      const showBlockedPage = (ip) => {
        document.body.innerHTML = `
          <div id="blocked-screen" style="display: flex;">
            <div class="blocked-content">
              <div class="blocked-icon">BANNED</div>
              <h1 class="blocked-title">HỆ THỐNG ĐÃ KHÓA</h1>
              <p class="blocked-desc">Bạn đã vi phạm chính sách bảo mật của MC Hoàng Phúc khi cố tình sử dụng công cụ DevTools hoặc Source Code. Quyền truy cập của bạn đã bị tước bỏ vĩnh viễn.</p>
              <div class="blocked-ip-box">
                <div class="blocked-ip-label">Địa chỉ IP vi phạm bị phong tỏa</div>
                <div class="blocked-ip-value">${ip}</div>
              </div>
              <p class="blocked-warning">Vị trí địa lý và thiết bị của bạn đã được báo cáo cho Quản trị viên.</p>
            </div>
          </div>
        `;
        window.stop();
      };

      try {
        // 1. Check local session storage first (Instant block)
        if (localStorage.getItem('admin_blocked') === 'true') {
          showBlockedPage("PHÁT HIỆN QUA THIẾT BỊ");
          return;
        }

        // 2. Fetch current user IP from API
        const ipResp = await fetch('https://hoangphuc-56rg.vercel.app/api/save-log');
        const { ip } = await ipResp.json();

        // 3. Check against Global Blacklist from GitHub logs.json
        const logsUrl = `https://raw.githubusercontent.com/hoanggiang20041/hoangphuc/main/admin/logs.json?t=${Date.now()}`;
        const logsResp = await fetch(logsUrl);
        if (logsResp.ok) {
          const logs = await logsResp.json();
          const isBlacklisted = logs.some(log => log.ip === ip && log.blocked === true);
          if (isBlacklisted) {
            localStorage.setItem('admin_blocked', 'true'); // Sync to local
            showBlockedPage(ip);
            return;
          }
        }

        // 4. Set up live monitors
        let violations = 0;
        const report = async (reason) => {
          violations++;
          console.clear();
          console.log("%cSTOP!", "color:red; font-size:50px; font-weight:bold;");
          
          if (violations >= 3) {
            localStorage.setItem('admin_blocked', 'true');
          }

          if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
              const mapUrl = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
              await fetch('https://hoangphuc-56rg.vercel.app/api/save-log', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                  event: reason, 
                  location: mapUrl, 
                  ua: navigator.userAgent,
                  isFatal: violations >= 2 
                })
              });
              if (violations >= 2) location.reload();
            }, () => {
              if (violations >= 2) location.reload();
            });
          }
        };

        // Chặn phím tắt
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
          if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
            e.preventDefault();
            report("Phím tắt DevTools");
          }
        });

        // Debugger Trap
        setInterval(() => {
          const start = performance.now();
          debugger;
          if (performance.now() - start > 100) report("Debugger Monitor");
        }, 1500);

      } catch (e) { console.warn("Security check bypassed due to error."); }
    })();
  </script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css"/>
</head>
<body>
  <div class="header">
    <div style="font-weight: 600;">MC HOÀNG PHÚ <span style="color: var(--gold); margin-left: 0.5rem; font-size: 0.8rem;">SECURE ADMIN</span></div>
    <div id="auth-status"></div>
  </div>

  <div class="container">
    <!-- Login View -->
    <div id="view-login" class="card">
      <h2>Quản trị viên</h2>
      <label>Email Admin</label>
      <input type="email" id="admin-email" placeholder="admin@gmail.com">
      <label>Mật khẩu</label>
      <input type="password" id="admin-password">
      <button class="btn btn-gold" id="btn-login-pw">Đăng nhập ngay</button>
      <div id="login-msg"></div>
    </div>

    <!-- Dashboard View -->
    <div id="view-admin" class="hidden">
      <div class="tabs" id="tab-list">
        <button class="tab active" data-file="index.html">Trang Chủ</button>
        <button class="tab" data-file="hoangphuc/about.html">Giới Thiệu</button>
        <button class="tab" data-file="skill/dan-chuong-trinh.html">Dẫn Chương Trình</button>
        <button class="tab" data-file="skill/host-livestream.html">Host Livestream</button>
        <button class="tab" data-file="skill/voice.html">Voice</button>
        <button class="tab" data-file="LOGS">Nhật ký vi phạm</button>
      </div>

      <div class="card">
        <div id="editor-container"></div>
        <div id="save-area" style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: space-between; border-top: 1px solid #333; padding-top: 1.5rem;">
          <button class="btn btn-gold" id="btn-save">Lưu toàn bộ HTML</button>
          <button class="btn btn-outline" onclick="location.reload()">Tải lại trang</button>
        </div>
        <div id="save-status"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const ADMIN_EMAILS = ["giang10012004@gmail.com", "mchoangphuc2207@gmail.com"];
    const firebaseConfig = {
      apiKey: "AIzaSyAIGdCJzDHVi0xhsz-y_FWhmk1b2InEFks",
      authDomain: "mchoangphuc-c0922.firebaseapp.com",
      projectId: "mchoangphuc-c0922",
      storageBucket: "mchoangphuc-c0922.firebasestorage.app",
      messagingSenderId: "940282310763",
      appId: "1:940282310763:web:b8af0d089803f3f8a4012e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let currentFile = "index.html";
    let htmlDoc = null;

    onAuthStateChanged(auth, (user) => {
      if (user && ADMIN_EMAILS.includes(user.email)) {
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-admin').classList.remove('hidden');
        document.getElementById('auth-status').innerHTML = `<span style="font-size:0.8rem;margin-right:1rem;">${user.email}</span><button class="btn btn-outline btn-sm" id="btn-logout">Thoát</button>`;
        document.getElementById('btn-logout').onclick = () => signOut(auth);
        loadPage(currentFile);
      } else {
        if(user) signOut(auth);
        document.getElementById('view-login').classList.remove('hidden');
        document.getElementById('view-admin').classList.add('hidden');
      }
    });

    document.getElementById('btn-login-pw').onclick = async () => {
      const e = document.getElementById('admin-email').value;
      const p = document.getElementById('admin-password').value;
      try { await signInWithEmailAndPassword(auth, e, p); } catch (err) { alert("Sai thông tin!"); }
    };

    async function loadPage(file) {
      const container = document.getElementById('editor-container');
      const saveArea = document.getElementById('save-area');
      container.innerHTML = '<p>Đang tải dữ liệu...</p>';
      saveArea.classList.remove('hidden');

      if (file === 'LOGS') {
        saveArea.classList.add('hidden');
        try {
          const resp = await fetch(`https://raw.githubusercontent.com/hoanggiang20041/hoangphuc/main/admin/logs.json?t=${Date.now()}`);
          const logs = await resp.json();
          container.innerHTML = "<h3>Nhật ký vi phạm bảo mật</h3>";
          logs.reverse().forEach(log => {
            const div = document.createElement('div');
            div.className = 'log-item';
            div.innerHTML = `<div><b>${log.time}</b>: ${log.event} <br><span style="color:red;font-family:monospace">[IP: ${log.ip}]</span></div><a class="log-link" href="${log.location}" target="_blank">Google Maps</a>`;
            container.appendChild(div);
          });
        } catch(e) { container.innerHTML = "<p>Chưa có nhật ký vi phạm.</p>"; }
        return;
      }

      try {
        const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        const baseUrl = isLocal ? '/' : 'https://raw.githubusercontent.com/hoanggiang20041/hoangphuc/main/';
        const resp = await fetch(`${baseUrl}${file}?t=${Date.now()}`);
        const html = await resp.text();
        htmlDoc = new DOMParser().parseFromString(html, 'text/html');
        window.__templates = [];
        htmlDoc.querySelectorAll('[data-admin-container]').forEach((con, idx) => {
          const firstItem = con.querySelector('[data-admin-item]');
          window.__templates[idx] = firstItem ? firstItem.cloneNode(true) : null;
        });
        currentFile = file;
        renderEditor();
      } catch (e) { container.innerHTML = '<p>Lỗi nạp file.</p>'; }
    }

    function renderEditor() {
      const container = document.getElementById('editor-container');
      container.innerHTML = `<h3>Sửa file: ${currentFile}</h3>`;
      
      htmlDoc.querySelectorAll('[data-admin-container]').forEach((con, cIdx) => {
        const group = document.createElement('div');
        group.className = 'container-group';
        group.innerHTML = `<h4 style="color:var(--gold)">DANH SÁCH: ${con.getAttribute('data-admin-container')}</h4>`;
        
        con.querySelectorAll('[data-admin-item]').forEach((item, iIdx) => {
          const box = document.createElement('div');
          box.className = 'item-box';
          box.innerHTML = `<div class="item-header"><strong>Mục #${iIdx+1}</strong> <button class="btn btn-danger btn-sm" onclick="removeItem(${cIdx}, ${iIdx})">Xóa</button></div>`;
          renderFields(item, box, `c${cIdx}-i${iIdx}`);
          group.appendChild(box);
        });
        const addBtn = document.createElement('button');
        addBtn.className = 'btn btn-gold btn-sm';
        addBtn.innerText = "+ Thêm mới mục";
        addBtn.onclick = () => addItem(cIdx);
        group.appendChild(addBtn);
        container.appendChild(group);
      });

      const loners = Array.from(htmlDoc.querySelectorAll('[data-admin-editable]')).filter(el => !el.closest('[data-admin-container]'));
      if (loners.length > 0) {
        const div = document.createElement('div');
        div.innerHTML = `<h4>THÔNG TIN KHÁC</h4>`;
        renderFields(htmlDoc, div, 'loner', loners);
        container.appendChild(div);
      }
    }

    function renderFields(root, target, prefix, list = null) {
      (list || root.querySelectorAll('[data-admin-editable]')).forEach((el, idx) => {
        const id = `${prefix}-${idx}`;
        el.setAttribute('data-admin-id', id);
        const div = document.createElement('div');
        div.className = 'editable-group';
        div.innerHTML = `<label>${el.getAttribute('data-admin-editable')}</label>`;
        if (el.tagName === 'IMG') {
          div.innerHTML += `<img src="${el.src}" class="img-preview" id="p-${id}"><input type="file" onchange="handleUp(this, '${id}')"><input type="text" value="${el.getAttribute('src')}" oninput="upVal('${id}', 'src', this.value)">`;
        } else if (el.tagName === 'IFRAME') {
          div.innerHTML += `<input type="text" value="${el.getAttribute('src')}" oninput="upVal('${id}', 'src', this.value)">`;
        } else {
          const area = document.createElement('textarea');
          area.value = el.innerText;
          area.oninput = e => upVal(id, 'text', e.target.value);
          div.appendChild(area);
        }
        target.appendChild(div);
      });
    }

    window.upVal = (id, type, val) => {
      const el = htmlDoc.querySelector(`[data-admin-id="${id}"]`);
      if (type === 'text') el.innerText = val;
      else { el.setAttribute(type, val); const p = document.getElementById(`p-${id}`); if(p) p.src = val; }
    };

    window.removeItem = (cIdx, iIdx) => {
      if(!confirm("Xóa?")) return;
      htmlDoc.querySelectorAll('[data-admin-container]')[cIdx].querySelectorAll('[data-admin-item]')[iIdx].remove();
      renderEditor();
    };

    window.addItem = (cIdx) => {
      const con = htmlDoc.querySelectorAll('[data-admin-container]')[cIdx];
      const items = con.querySelectorAll('[data-admin-item]');
      // Nếu còn item thì lấy item cuối làm mẫu, nếu lỡ xóa sạch thì lấy từ file gốc (đã lưu tạm)
      const template = items.length > 0 ? items[items.length - 1] : window.__templates[cIdx];
      const newItem = template.cloneNode(true);
      newItem.querySelectorAll('[data-admin-editable]').forEach(e => {
        if(e.tagName === 'IMG') e.src = "/img/placeholder.jpg";
        else if(e.tagName === 'IFRAME') e.src = "";
        else e.innerText = "Nội dung mới";
      });
      con.appendChild(newItem);
      renderEditor();
    };

    window.handleUp = async (input, id) => {
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = async e => {
        const idToken = await auth.currentUser.getIdToken();
        const filename = `img/${Date.now()}_${file.name.replace(/[^a-z0-9.]/gi, '_')}`;
        const resp = await fetch('https://hoangphuc-56rg.vercel.app/api/save-content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: idToken, path: filename, content: e.target.result, isImage: true })
        });
        const res = await resp.json();
        if(res.success) upVal(id, 'src', '/'+filename);
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('btn-save').onclick = async () => {
      const status = document.getElementById('save-status');
      status.innerText = "Đang lưu...";
      const clone = htmlDoc.cloneNode(true);
      clone.querySelectorAll('[data-admin-id]').forEach(e => e.removeAttribute('data-admin-id'));
      try {
        const idToken = await auth.currentUser.getIdToken();
        const response = await fetch('https://hoangphuc-56rg.vercel.app/api/save-content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: idToken, path: currentFile, content: '<!DOCTYPE html>\n' + clone.documentElement.outerHTML })
        });
        const resData = await response.json();
        if(response.ok) status.innerText = "Đã cập nhật GitHub thành công!"; 
        else alert("Lỗi lưu: " + (resData.error || response.statusText));
      } catch(e) { alert(e.message); }
    };

    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFile = tab.dataset.file;
        loadPage(currentFile);
      };
    });
  </script>
