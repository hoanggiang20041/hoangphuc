<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CMS | MC Hoàng Phúc</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0; background:#0b0b0b;">
  <!-- Div rỗng để CMS mount vào -->
  <div id="nc-root"></div>

  <!-- Thư viện hỗ trợ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <script>
    // Ép buộc xóa mọi nội dung cũ để tránh lỗi React removeChild
    document.addEventListener('DOMContentLoaded', () => {
      window.CMS_MANUAL_INIT = true;
      
      // Thêm tham số timestamp để chống cache config.yml
      fetch('./config.yml?t=' + Date.now())
        .then(r => r.text())
        .then(cfg => {
          const config = jsyaml.load(cfg);
          console.log("CMS Config loaded successfully");
          window.CMS.init({ config });
        })
        .catch(err => {
          console.error("CMS Config Error:", err);
          alert("Không thể tải file cấu hình. Vui lòng kiểm tra lại file config.yml");
        });
    });
  </script>
</body>
</html>
