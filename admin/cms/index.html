<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MC Hoàng Phúc • CMS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--fg:#f5f5f5;--muted:#b5b5b5;--gold:#D4AF37}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.bar{padding:10px 14px;border-bottom:1px solid rgba(212,175,55,.12);backdrop-filter:blur(6px)}
</style>
</head>
<body>
<div class="bar">MC Hoàng Phúc • CMS (Decap + Netlify Identity)</div>
<!-- Netlify Identity (bắt buộc để login/recovery hoạt động) -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<!-- Decap CMS -->
<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
<script>
// Mở hộp thoại đăng nhập nếu chưa đăng nhập
if (window.netlifyIdentity) {
window.netlifyIdentity.on('init', user => {
if (!user) {
// Tự hiện login khi vào trang
window.netlifyIdentity.open();
}
});
}
</script>
</body>
</html>
