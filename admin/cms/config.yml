backend:
  name: github
  repo: hoanggiang20041/hoangphuc
  branch: main
  base_url: https://hoangphuc-56rg.vercel.app
  auth_endpoint: api/auth

media_folder: "img"
public_folder: "/img"

collections:
  # ========== CẤU HÌNH WEBSITE ==========
  - name: "settings"
    label: "⚙️ Cấu hình Website"
    files:
      - name: "site"
        label: "Thông tin chung"
        file: "admin/data/content.json"
        format: "json"
        fields:
          - label: "Thông tin chung"
            name: "site"
            widget: "object"
            fields:
              - label: "Tiêu đề website"
                name: "title"
                widget: "string"
              - label: "Mô tả website"
                name: "description"
                widget: "text"
              - label: "Số điện thoại"
                name: "phone"
                widget: "string"
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "Câu trích dẫn"
                name: "quote"
                widget: "text"
              - label: "Mạng xã hội"
                name: "social"
                widget: "object"
                fields:
                  - label: "Facebook"
                    name: "facebook"
                    widget: "string"
                    required: false
                  - label: "Instagram"
                    name: "instagram"
                    widget: "string"
                    required: false
                  - label: "YouTube"
                    name: "youtube"
                    widget: "string"
                    required: false

  # ========== TRANG CHỦ ==========
  - name: "home"
    label: "Trang Chủ"
    files:
      - name: "home_content"
        label: "Nội dung Trang Chủ"
        file: "admin/data/home.json"
        format: "json"
        fields:
          - label: "Phần Giới Thiệu"
            name: "intro"
            widget: "object"
            fields:
              - label: "Ảnh đại diện (upload)"
                name: "image"
                widget: "image"
                required: false
              - label: "Ảnh đại diện (URL)"
                name: "image_url"
                widget: "string"
                required: false
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Các vai trò"
                name: "roles"
                widget: "list"
                field:
                  label: "Vai trò"
                  name: "role"
                  widget: "string"
              - label: "Câu trích dẫn"
                name: "quote"
                widget: "text"
          
          - label: "Phần Kỹ Năng"
            name: "skills"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Mô tả"
                name: "subtitle"
                widget: "string"
              - label: "Ảnh (upload)"
                name: "image"
                widget: "image"
                required: false
              - label: "Ảnh (URL)"
                name: "image_url"
                widget: "string"
                required: false
              - label: "Các kỹ năng"
                name: "items"
                widget: "list"
                fields:
                  - label: "Tiêu đề kỹ năng"
                    name: "title"
                    widget: "string"
                  - label: "Mô tả"
                    name: "description"
                    widget: "text"
                  - label: "Icon (Font Awesome class)"
                    name: "icon"
                    widget: "string"
                    hint: "Ví dụ: fas fa-microphone"
                  - label: "Link chi tiết"
                    name: "link"
                    widget: "string"

  # ========== TRANG GIỚI THIỆU ==========
  - name: "about"
    label: "👤 Trang Giới Thiệu"
    files:
      - name: "about_content"
        label: "Nội dung Trang Giới Thiệu"
        file: "admin/data/about.json"
        format: "json"
        fields:
          - label: "Phần Giới Thiệu"
            name: "intro"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Câu trích dẫn"
                name: "quote"
                widget: "text"
              - label: "Ảnh chính (upload)"
                name: "main_image"
                widget: "image"
                required: false
              - label: "Ảnh chính (URL)"
                name: "main_image_url"
                widget: "string"
                required: false
              - label: "Mô tả"
                name: "description"
                widget: "text"
              - label: "Ảnh phụ 1 (upload)"
                name: "gallery_image_1"
                widget: "image"
                required: false
              - label: "Ảnh phụ 1 (URL)"
                name: "gallery_image_1_url"
                widget: "string"
                required: false
              - label: "Ảnh phụ 2 (upload)"
                name: "gallery_image_2"
                widget: "image"
                required: false
              - label: "Ảnh phụ 2 (URL)"
                name: "gallery_image_2_url"
                widget: "string"
                required: false
              - label: "Thông tin liên hệ"
                name: "contact_info"
                widget: "object"
                fields:
                  - label: "Họ và tên"
                    name: "name"
                    widget: "string"
                  - label: "Số điện thoại"
                    name: "phone"
                    widget: "string"
                  - label: "Chiều cao"
                    name: "height"
                    widget: "string"
                  - label: "Khu vực"
                    name: "region"
                    widget: "string"
                  - label: "Email"
                    name: "email"
                    widget: "string"
          
          - label: "Phần Câu Chuyện"
            name: "story"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Phần 1"
                name: "part_1"
                widget: "text"
              - label: "Phần 2"
                name: "part_2"
                widget: "text"
          
          - label: "Phần Học Viện"
            name: "academy"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Khóa học"
                name: "course"
                widget: "string"
              - label: "Mô tả"
                name: "description"
                widget: "text"

          - label: "Slideshow (Ảnh/Video bằng URL)"
            name: "slideshow"
            widget: "list"
            fields:
              - label: "Loại"
                name: "type"
                widget: "select"
                options:
                  - { label: "Ảnh", value: "image" }
                  - { label: "Video", value: "video" }
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Ảnh thumbnail (upload)"
                name: "thumb"
                widget: "image"
                required: false
              - label: "Ảnh thumbnail (URL)"
                name: "thumb_url"
                widget: "string"
                required: false
              - label: "Chú thích"
                name: "caption"
                widget: "string"
                required: false

  # ========== THÀNH PHẦN CÓ THỂ TÁI SỬ DỤNG ==========
  - name: "components"
    label: "🎨 Thành Phần"
    files:
      - name: "footer"
        label: "Footer"
        file: "admin/data/footer.json"
        format: "json"
        fields:
          - label: "Nội dung Footer"
            name: "footer"
            widget: "object"
            fields:
              - label: "Bản quyền"
                name: "copyright"
                widget: "string"

  # ========== VIDEO (LINK) ==========
  - name: "videos"
    label: "🎬 Video (URL)"
    folder: "admin/data/videos"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Tiêu đề", name: "title", widget: "string" }
      - { label: "Video URL (YouTube/Vimeo/MP4)", name: "video_url", widget: "string", hint: "Dán link YouTube hoặc link file .mp4 từ bên ngoài vào đây." }
      - { label: "Nền tảng", name: "platform", widget: "select", required: false, options: ["youtube", "vimeo", "other"] }
      - { label: "Thumbnail (upload)", name: "thumbnail", widget: "image", required: false }
      - { label: "Thumbnail (URL)", name: "thumbnail_url", widget: "string", required: false }
      - { label: "Mô tả", name: "description", widget: "text", required: false }
      - { label: "Danh mục", name: "category", widget: "string", required: false }
      - { label: "Ngày", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }

  # ========== KỸ NĂNG (TRANG CHI TIẾT) ==========
  - name: "skills_pages"
    label: "🧩 Trang Kỹ Năng"
    files:
      - name: "skill_dan_chuong_trinh"
        label: "Dẫn Chương Trình"
        file: "admin/data/skills/dan-chuong-trinh.json"
        format: "json"
        fields:
          - { label: "Tiêu đề trang", name: "title", widget: "string" }
          - label: "Các phân đoạn"
            name: "sections"
            widget: "list"
            fields:
              - { label: "ID (neo cuộn)", name: "id", widget: "string", required: false }
              - { label: "Tiêu đề", name: "title", widget: "string" }
              - { label: "Kiểu", name: "kind", widget: "select", options: ["slideshow", "videos"], default: "slideshow" }
              - label: "Nội dung"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Loại", name: "type", widget: "select", options: ["image", "video"], default: "image" }
                  - { label: "Ảnh (upload)", name: "image", widget: "image", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Chú thích", name: "caption", widget: "string", required: false }
      - name: "skill_host_livestream"
        label: "Host Livestream"
        file: "admin/data/skills/host-livestream.json"
        format: "json"
        fields:
          - { label: "Tiêu đề trang", name: "title", widget: "string" }
          - label: "Các phân đoạn"
            name: "sections"
            widget: "list"
            fields:
              - { label: "ID (neo cuộn)", name: "id", widget: "string", required: false }
              - { label: "Tiêu đề", name: "title", widget: "string", required: false }
              - { label: "Kiểu", name: "kind", widget: "select", options: ["slideshow", "videos"], default: "slideshow" }
              - label: "Nội dung"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Loại", name: "type", widget: "select", options: ["image", "video"], default: "image" }
                  - { label: "Ảnh (upload)", name: "image", widget: "image", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Chú thích", name: "caption", widget: "string", required: false }
      - name: "skill_voice"
        label: "Voice (Lồng Tiếng)"
        file: "admin/data/skills/voice.json"
        format: "json"
        fields:
          - { label: "Tiêu đề trang", name: "title", widget: "string" }
          - label: "Tabs"
            name: "tabs"
            widget: "list"
            fields:
              - { label: "Tiêu đề tab", name: "title", widget: "string" }
              - label: "Danh sách video"
                name: "videos"
                widget: "list"
                field: { label: "Video URL", name: "video_url", widget: "string" }

  # ========== THƯ VIỆN ẢNH ==========
  - name: "gallery"
    label: "🖼️ Thư Viện Ảnh"
    label_singular: "Ảnh"
    folder: "admin/data/gallery"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - label: "Tiêu đề"
        name: "title"
        widget: "string"
      - label: "Ảnh (upload)"
        name: "image"
        widget: "image"
        required: false
        media_folder: "img"
        public_folder: "/img"
      - label: "Ảnh (URL)"
        name: "image_url"
        widget: "string"
        required: false
      - label: "Mô tả"
        name: "description"
        widget: "text"
        required: false
      - label: "Danh mục"
        name: "category"
        widget: "select"
        options:
          - label: "Sự kiện"
            value: "event"
          - label: "Tiệc cưới"
            value: "wedding"
          - label: "Livestream"
            value: "livestream"
          - label: "Khác"
            value: "other"
        required: false
      - label: "Ngày"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        time_format: false
