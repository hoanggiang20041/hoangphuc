backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  # ========== CẤU HÌNH WEBSITE ==========
  - name: "settings"
    label: "⚙️ Cấu hình Website"
    files:
      - name: "site"
        label: "Thông tin chung"
        file: "admin/data/content.json"
        format: "json"
        fields:
          - label: "Thông tin chung"
            name: "site"
            widget: "object"
            fields:
              - label: "Tiêu đề website"
                name: "title"
                widget: "string"
              - label: "Mô tả website"
                name: "description"
                widget: "text"
              - label: "Số điện thoại"
                name: "phone"
                widget: "string"
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "Câu trích dẫn"
                name: "quote"
                widget: "text"
              - label: "Mạng xã hội"
                name: "social"
                widget: "object"
                fields:
                  - label: "Facebook"
                    name: "facebook"
                    widget: "string"
                    required: false
                  - label: "Instagram"
                    name: "instagram"
                    widget: "string"
                    required: false
                  - label: "YouTube"
                    name: "youtube"
                    widget: "string"
                    required: false

  # ========== TRANG CHỦ ==========
  - name: "home"
    label: "[object Object] Chủ"
    files:
      - name: "home_content"
        label: "Nội dung Trang Chủ"
        file: "admin/data/home.json"
        format: "json"
        fields:
          - label: "Phần Giới Thiệu"
            name: "intro"
            widget: "object"
            fields:
              - label: "Ảnh đại diện"
                name: "image"
                widget: "image"
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Các vai trò"
                name: "roles"
                widget: "list"
                field:
                  label: "Vai trò"
                  name: "role"
                  widget: "string"
              - label: "Câu trích dẫn"
                name: "quote"
                widget: "text"
          
          - label: "Phần Kỹ Năng"
            name: "skills"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Mô tả"
                name: "subtitle"
                widget: "string"
              - label: "Ảnh"
                name: "image"
                widget: "image"
              - label: "Các kỹ năng"
                name: "items"
                widget: "list"
                fields:
                  - label: "Tiêu đề kỹ năng"
                    name: "title"
                    widget: "string"
                  - label: "Mô tả"
                    name: "description"
                    widget: "text"
                  - label: "Icon (Font Awesome class)"
                    name: "icon"
                    widget: "string"
                    hint: "Ví dụ: fas fa-microphone"
                  - label: "Link chi tiết"
                    name: "link"
                    widget: "string"

  # ========== TRANG GIỚI THIỆU ==========
  - name: "about"
    label: "👤 Trang Giới Thiệu"
    files:
      - name: "about_content"
        label: "Nội dung Trang Giới Thiệu"
        file: "admin/data/about.json"
        format: "json"
        fields:
          - label: "Phần Giới Thiệu"
            name: "intro"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Câu trích dẫn"
                name: "quote"
                widget: "text"
              - label: "Ảnh chính"
                name: "main_image"
                widget: "image"
              - label: "Mô tả"
                name: "description"
                widget: "text"
              - label: "Ảnh phụ 1"
                name: "gallery_image_1"
                widget: "image"
              - label: "Ảnh phụ 2"
                name: "gallery_image_2"
                widget: "image"
              - label: "Thông tin liên hệ"
                name: "contact_info"
                widget: "object"
                fields:
                  - label: "Họ và tên"
                    name: "name"
                    widget: "string"
                  - label: "Số điện thoại"
                    name: "phone"
                    widget: "string"
                  - label: "Chiều cao"
                    name: "height"
                    widget: "string"
                  - label: "Khu vực"
                    name: "region"
                    widget: "string"
                  - label: "Email"
                    name: "email"
                    widget: "string"
          
          - label: "Phần Câu Chuyện"
            name: "story"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Phần 1"
                name: "part_1"
                widget: "text"
              - label: "Phần 2"
                name: "part_2"
                widget: "text"
          
          - label: "Phần Học Viện"
            name: "academy"
            widget: "object"
            fields:
              - label: "Tiêu đề"
                name: "title"
                widget: "string"
              - label: "Khóa học"
                name: "course"
                widget: "string"
              - label: "Mô tả"
                name: "description"
                widget: "text"

  # ========== THÀNH PHẦN CÓ THỂ TÁI SỬ DỤNG ==========
  - name: "components"
    label: "🎨 Thành Phần"
    files:
      - name: "footer"
        label: "Footer"
        file: "admin/data/footer.json"
        format: "json"
        fields:
          - label: "Nội dung Footer"
            name: "footer"
            widget: "object"
            fields:
              - label: "Bản quyền"
                name: "copyright"
                widget: "string"

  # ========== THƯ VIỆN ẢNH ==========
  - name: "gallery"
    label: "🖼️ Thư Viện Ảnh"
    label_singular: "Ảnh"
    folder: "admin/data/gallery"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - label: "Tiêu đề"
        name: "title"
        widget: "string"
      - label: "Ảnh"
        name: "image"
        widget: "image"
        media_folder: "img"
        public_folder: "/img"
      - label: "Mô tả"
        name: "description"
        widget: "text"
        required: false
      - label: "Danh mục"
        name: "category"
        widget: "select"
        options:
          - label: "Sự kiện"
            value: "event"
          - label: "Tiệc cưới"
            value: "wedding"
          - label: "Livestream"
            value: "livestream"
          - label: "Khác"
            value: "other"
        required: false
      - label: "Ngày"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        time_format: false
