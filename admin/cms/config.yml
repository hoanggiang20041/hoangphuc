backend:
  name: github
  repo: hoanggiang20041/hoangphuc
  branch: main
  base_url: https://hoangphuc-56rg.vercel.app
  auth_endpoint: api/auth

media_folder: "img"
public_folder: "/img"

collections:
  # ========== CAU HINH WEBSITE ==========
  - name: "settings"
    label: "Cau hinh Website"
    files:
      - name: "site"
        label: "Thong tin chung"
        file: "admin/data/content.json"
        format: "json"
        fields:
          - label: "Thong tin chung"
            name: "site"
            widget: "object"
            fields:
              - label: "Tieu de website"
                name: "title"
                widget: "string"
              - label: "Mo ta website"
                name: "description"
                widget: "text"
              - label: "So dien thoai"
                name: "phone"
                widget: "string"
              - label: "Email"
                name: "email"
                widget: "string"
              - label: "Cau trich dan"
                name: "quote"
                widget: "text"
              - label: "Mang xa hoi"
                name: "social"
                widget: "object"
                fields:
                  - label: "Facebook"
                    name: "facebook"
                    widget: "string"
                    required: false
                  - label: "Instagram"
                    name: "instagram"
                    widget: "string"
                    required: false
                  - label: "YouTube"
                    name: "youtube"
                    widget: "string"
                    required: false

  # ========== TRANG CHU ==========
  - name: "home"
    label: "Trang Chu"
    files:
      - name: "home_content"
        label: "Noi dung Trang Chu"
        file: "admin/data/home.json"
        format: "json"
        fields:
          - label: "Phan Gioi Thieu"
            name: "intro"
            widget: "object"
            fields:
              - label: "Anh dai dien (upload)"
                name: "image"
                widget: "image"
                required: false
              - label: "Anh dai dien (URL)"
                name: "image_url"
                widget: "string"
                required: false
              - label: "Tieu de"
                name: "title"
                widget: "string"
              - label: "Cac vai tro"
                name: "roles"
                widget: "list"
                field:
                  label: "Vai tro"
                  name: "role"
                  widget: "string"
              - label: "Cau trich dan"
                name: "quote"
                widget: "text"
          
          - label: "Phan Ky Nang"
            name: "home_skills"
            widget: "object"
            fields:
              - label: "Tieu de"
                name: "title"
                widget: "string"
              - label: "Mo ta"
                name: "subtitle"
                widget: "string"
              - label: "Anh (upload)"
                name: "image"
                widget: "image"
                required: false
              - label: "Anh (URL)"
                name: "image_url"
                widget: "string"
                required: false
              - label: "Cac ky nang"
                name: "items"
                widget: "list"
                fields:
                  - label: "Tieu de ky nang"
                    name: "title"
                    widget: "string"
                  - label: "Mo ta"
                    name: "description"
                    widget: "text"
                  - label: "Icon (Font Awesome class)"
                    name: "icon"
                    widget: "string"
                    hint: "Vi du: fas fa-microphone"
                  - label: "Link chi tiet"
                    name: "link"
                    widget: "string"

  # ========== TRANG GIOI THIEU ==========
  - name: "about"
    label: "Trang Gioi Thieu"
    files:
      - name: "about_content"
        label: "Noi dung Trang Gioi Thieu"
        file: "admin/data/about.json"
        format: "json"
        fields:
          - label: "Phan Gioi Thieu"
            name: "intro"
            widget: "object"
            fields:
              - label: "Tieu de"
                name: "title"
                widget: "string"
              - label: "Cau trich dan"
                name: "quote"
                widget: "text"
              - label: "Anh chinh (upload)"
                name: "main_image"
                widget: "image"
                required: false
              - label: "Anh chinh (URL)"
                name: "main_image_url"
                widget: "string"
                required: false
              - label: "Mo ta"
                name: "description"
                widget: "text"
              - label: "Anh phu 1 (upload)"
                name: "gallery_image_1"
                widget: "image"
                required: false
              - label: "Anh phu 1 (URL)"
                name: "gallery_image_1_url"
                widget: "string"
                required: false
              - label: "Anh phu 2 (upload)"
                name: "gallery_image_2"
                widget: "image"
                required: false
              - label: "Anh phu 2 (URL)"
                name: "gallery_image_2_url"
                widget: "string"
                required: false
              - label: "Thong tin lien he"
                name: "contact_info"
                widget: "object"
                fields:
                  - label: "Ho va ten"
                    name: "name"
                    widget: "string"
                  - label: "So dien thoai"
                    name: "phone"
                    widget: "string"
                  - label: "Chieu cao"
                    name: "height"
                    widget: "string"
                  - label: "Khu vuc"
                    name: "region"
                    widget: "string"
                  - label: "Email"
                    name: "email"
                    widget: "string"
          
          - label: "Phan Cau Chuyen"
            name: "story"
            widget: "object"
            fields:
              - label: "Tieu de"
                name: "title"
                widget: "string"
              - label: "Phan 1"
                name: "part_1"
                widget: "text"
              - label: "Phan 2"
                name: "part_2"
                widget: "text"
          
          - label: "Phan Hoc Vien"
            name: "academy"
            widget: "object"
            fields:
              - label: "Tieu de"
                name: "title"
                widget: "string"
              - label: "Khoa hoc"
                name: "course"
                widget: "string"
              - label: "Mo ta"
                name: "description"
                widget: "text"

          - label: "Slideshow (Anh/Video bang URL)"
            name: "slideshow"
            widget: "list"
            fields:
              - label: "Loai"
                name: "type"
                widget: "select"
                options:
                  - { label: "Anh", value: "image" }
                  - { label: "Video", value: "video" }
              - label: "URL"
                name: "url"
                widget: "string"
              - label: "Anh thumbnail (upload)"
                name: "thumb"
                widget: "image"
                required: false
              - label: "Anh thumbnail (URL)"
                name: "thumb_url"
                widget: "string"
                required: false
              - label: "Chu thich"
                name: "caption"
                widget: "string"
                required: false

  # ========== THANH PHAN CO THE TAI SU DUNG ==========
  - name: "components"
    label: "Thanh Phan"
    files:
      - name: "footer"
        label: "Footer"
        file: "admin/data/footer.json"
        format: "json"
        fields:
          - label: "Noi dung Footer"
            name: "footer"
            widget: "object"
            fields:
              - label: "Ban quyen"
                name: "copyright"
                widget: "string"

  # ========== VIDEO (LINK) ==========
  - name: "videos_list"
    label: "Danh sach Video"
    folder: "admin/data/videos"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Tieu de", name: "title", widget: "string" }
      - { label: "Video URL (YouTube/Vimeo/MP4)", name: "video_url", widget: "string", hint: "Dan link YouTube hoac link file .mp4 tu ben ngoai vao day." }
      - { label: "Nen tang", name: "platform", widget: "select", required: false, options: ["youtube", "vimeo", "other"] }
      - { label: "Thumbnail (upload)", name: "thumbnail", widget: "image", required: false }
      - { label: "Thumbnail (URL)", name: "thumbnail_url", widget: "string", required: false }
      - { label: "Mo ta", name: "description", widget: "text", required: false }
      - { label: "Danh muc", name: "category", widget: "string", required: false }
      - { label: "Ngay", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }

  # ========== KY NANG (TRANG CHI TIET) ==========
  - name: "skills_pages"
    label: "Trang Ky Nang"
    files:
      - name: "skill_dan_chuong_trinh"
        label: "Dan Chuong Trinh"
        file: "admin/data/skills/dan-chuong-trinh.json"
        format: "json"
        fields:
          - { label: "Tieu de trang", name: "title", widget: "string" }
          - label: "Cac phan doan"
            name: "sections"
            widget: "list"
            fields:
              - { label: "ID (neo cuon)", name: "id", widget: "string", required: false }
              - { label: "Tieu de", name: "title", widget: "string" }
              - { label: "Kieu", name: "kind", widget: "select", options: ["slideshow", "videos"], default: "slideshow" }
              - label: "Noi dung"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Loai", name: "type", widget: "select", options: ["image", "video"], default: "image" }
                  - { label: "Anh (upload)", name: "image", widget: "image", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Chu thich", name: "caption", widget: "string", required: false }
      - name: "skill_host_livestream"
        label: "Host Livestream"
        file: "admin/data/skills/host-livestream.json"
        format: "json"
        fields:
          - { label: "Tieu de trang", name: "title", widget: "string" }
          - label: "Cac phan doan"
            name: "sections"
            widget: "list"
            fields:
              - { label: "ID (neo cuon)", name: "id", widget: "string", required: false }
              - { label: "Tieu de", name: "title", widget: "string", required: false }
              - { label: "Kieu", name: "kind", widget: "select", options: ["slideshow", "videos"], default: "slideshow" }
              - label: "Noi dung"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Loai", name: "type", widget: "select", options: ["image", "video"], default: "image" }
                  - { label: "Anh (upload)", name: "image", widget: "image", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Chu thich", name: "caption", widget: "string", required: false }
      - name: "skill_voice"
        label: "Voice (Long Tieng)"
        file: "admin/data/skills/voice.json"
        format: "json"
        fields:
          - { label: "Tieu de trang", name: "title", widget: "string" }
          - label: "Tabs"
            name: "tabs"
            widget: "list"
            fields:
              - { label: "Tieu de tab", name: "title", widget: "string" }
              - label: "Danh sach video"
                name: "videos_items"
                widget: "list"
                field: { label: "Video URL", name: "video_url", widget: "string" }

  # ========== THU VIEN ANH ==========
  - name: "gallery_collection"
    label: "Thu Vien Anh"
    label_singular: "Anh"
    folder: "admin/data/gallery"
    create: true
    format: "json"
    slug: "{{slug}}"
    fields:
      - label: "Tieu de"
        name: "title"
        widget: "string"
      - label: "Anh (upload)"
        name: "image"
        widget: "image"
        required: false
        media_folder: "img"
        public_folder: "/img"
      - label: "Anh (URL)"
        name: "image_url"
        widget: "string"
        required: false
      - label: "Mo ta"
        name: "description"
        widget: "text"
        required: false
      - label: "Danh muc"
        name: "category"
        widget: "select"
        options:
          - label: "Su kien"
            value: "event"
          - label: "Tiec cuoi"
            value: "wedding"
          - label: "Livestream"
            value: "livestream"
          - label: "Khac"
            value: "other"
        required: false
      - label: "Ngay"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        time_format: false
